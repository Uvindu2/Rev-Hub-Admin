<label class="dropdown-component-label">
  {{ label }}
</label>

<div class="dropdown-container">

  <!-- Search input -->
  <div
    class="dropdown-input-wrapper"
    [class.invalid-border]="isInvalid">

    <input
      type="text"
      [(ngModel)]="searchText"
      placeholder="Search options..."
      class="dropdown-search-input"
      (focus)="isOpen = true"
    />

    <span
      class="dropdown-toggle"
      (click)="$event.stopPropagation(); toggleDropdown()">
      {{ isOpen ? '▲' : '▼' }}
    </span>

  </div>

  <!-- Dropdown -->
  <div
    class="dropdown-options-box"
    *ngIf="isOpen">

    <!-- Select All -->
    <div
      class="checkbox-option select-all-option"
      *ngIf="filteredItems.length > 0">

      <label class="checkbox-label-wrapper">

        <input
          type="checkbox"
          [checked]="areAllFilteredSelected()"
          [indeterminate]="isSomeFilteredSelected()"
          (change)="toggleSelectAll()"
        />

        <span class="option-text">
          {{ areAllFilteredSelected() ? 'Deselect All' : 'Select All' }}
        </span>

      </label>

    </div>

    <!-- Individual options -->
    <div
      *ngFor="let item of filteredItems"
      class="checkbox-option">

      <label class="checkbox-label-wrapper">

        <input
          type="checkbox"
          [checked]="isSelected(item)"
          (change)="toggle(item)"
        />

        <span class="option-text">
          {{ getItemLabel(item) }}
        </span>

      </label>

    </div>

    <!-- No results -->
    <div
      *ngIf="filteredItems.length === 0"
      class="no-results">
      No matching items found
    </div>

  </div>

  <!-- Selected tags -->
  <div
    class="selected-tags-container"
    *ngIf="value.length > 0">

    <span
      *ngFor="let item of value"
      class="selected-tag">

      {{ getSelectedLabel(item) }}

      <span
        class="remove-tag-btn"
        (click)="remove(item)">
        ×
      </span>

    </span>

  </div>

  <!-- Validation error -->
  <div
    *ngIf="isInvalid"
    class="dropdown-error-msg">
    {{ errorMessage }}
  </div>

</div>
