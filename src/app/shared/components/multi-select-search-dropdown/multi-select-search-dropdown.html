<!-- =========================================================
     LABEL
     ========================================================= -->

<label
  *ngIf="label"
  class="dropdown-component-label">
  {{ label }}
</label>


<div class="dropdown-container">

  <!-- =======================================================
       MAIN SELECT BOX
       ======================================================= -->

  <div
    class="dropdown-input-wrapper"
    [class.invalid-border]="isInvalid"
    (click)="toggleDropdown()"
  >

    <span
      class="dropdown-display-text"
      [class.placeholder]="value.length === 0">

      {{ selectedDisplayText }}

    </span>


    <span class="dropdown-toggle">
      {{ isOpen ? '▲' : '▼' }}
    </span>

  </div>


  <!-- =======================================================
       DROPDOWN PANEL
       ======================================================= -->

  <div
    class="dropdown-options-box"
    *ngIf="isOpen"
    (click)="$event.stopPropagation()"
  >

    <!-- =====================================================
         SEARCH
         ===================================================== -->

    <div class="dropdown-search-wrapper">

      <span class="dropdown-search-icon">
        🔍
      </span>

      <input
        #searchInput
        type="text"
        [(ngModel)]="searchText"
        placeholder="Search options..."
        class="dropdown-search-input"
        autocomplete="off"
      />

    </div>


    <!-- =====================================================
         OPTIONS
         ===================================================== -->

    <div class="dropdown-items-container">

      <!-- SELECT ALL -->

      <div
        *ngIf="filteredItems.length > 0"
        class="checkbox-option select-all-option"
      >

        <label class="checkbox-label-wrapper">

          <input
            type="checkbox"
            [checked]="areAllFilteredSelected()"
            [indeterminate]="isSomeFilteredSelected()"
            (change)="toggleSelectAll()"
          />

          <span class="option-text">
            {{
              areAllFilteredSelected()
                ? 'Deselect All'
                : 'Select All'
            }}
          </span>

        </label>

      </div>


      <!-- INDIVIDUAL OPTIONS -->

      <div
        *ngFor="let item of filteredItems"
        class="checkbox-option"
      >

        <label class="checkbox-label-wrapper">

          <input
            type="checkbox"
            [checked]="isSelected(item)"
            (change)="toggle(item)"
          />

          <span class="option-text">
            {{ getItemLabel(item) }}
          </span>

        </label>

      </div>


      <!-- NO RESULTS -->

      <div
        *ngIf="filteredItems.length === 0"
        class="no-results">

        No matching items found

      </div>

    </div>

  </div>


  <!-- =======================================================
       SELECTED TAGS
       ======================================================= -->

  <div
    *ngIf="value.length > 0"
    class="selected-tags-container"
  >

    <span
      *ngFor="let item of value"
      class="selected-tag"
    >

      <span class="selected-tag-text">
        {{ getSelectedLabel(item) }}
      </span>

      <span
        class="remove-tag-btn"
        (click)="remove(item); $event.stopPropagation()"
      >
        ×
      </span>

    </span>

  </div>


  <!-- =======================================================
       VALIDATION ERROR
       ======================================================= -->

  <div
    *ngIf="isInvalid"
    class="dropdown-error-msg">

    {{ errorMessage }}

  </div>

</div>
