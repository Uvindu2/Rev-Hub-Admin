<label *ngIf="label">
  {{ label }}
</label>

<div class="dropdown-container">

  <!-- =========================================
       CLOSED / SELECTED VALUE
       ========================================= -->
  <div
    class="dropdown-input-wrapper"
    [class.invalid-border]="isInvalid"
    (click)="toggleDropdown()"
  >

    <span
      class="dropdown-display-text"
      [class.placeholder]="!selectedDisplayLabel"
    >
      {{ selectedDisplayLabel || 'Select option...' }}
    </span>

    <span class="dropdown-toggle">
      {{ isOpen ? '▲' : '▼' }}
    </span>

  </div>


  <!-- =========================================
       DROPDOWN PANEL
       ========================================= -->
  <div
    class="dropdown-options-box"
    *ngIf="isOpen"
    (click)="$event.stopPropagation()"
  >

    <!-- SEARCH -->
    <div class="dropdown-search-wrapper">

      <span class="dropdown-search-icon">
        🔍
      </span>

      <input
        #searchInput
        type="text"
        [(ngModel)]="searchText"
        placeholder="Search makes..."
        class="dropdown-search-input"
        autocomplete="off"
      />

    </div>


    <!-- OPTIONS -->
    <div class="dropdown-items-container">

      <!-- ALL -->
      <div
        *ngIf="showAllOption"
        class="checkbox-option all-option"
        [class.option]="value === null"
        (click)="selectAll()"
      >
        <span class="option-text">
          {{ allLabel }}
        </span>
      </div>


      <!-- NORMAL OPTIONS -->
      <div
        *ngFor="let item of filteredItems"
        class="checkbox-option"
        [class.option]="isSelected(item)"
        (click)="selectItem(item)"
      >
        <span class="option-text">
          {{ getItemLabel(item) }}
        </span>
      </div>


      <!-- NO RESULTS -->
      <div
        *ngIf="filteredItems.length === 0 && !showAllOption"
        class="no-results"
      >
        No matching items found
      </div>

    </div>

  </div>


  <!-- ERROR -->
  <div
    *ngIf="isInvalid"
    class="dropdown-error-msg"
  >
    {{ errorMessage }}
  </div>

</div>
