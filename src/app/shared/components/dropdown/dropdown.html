<label *ngIf="label">
  {{ label }}
</label>

<div class="dropdown-container">

  <!-- =========================================
       CLOSED / SELECTED VALUE
       ========================================= -->

  <div class="dropdown-input-wrapper"
    [class.invalid-border]="isInvalid"
    [class.disabled]="disabled"
    [attr.aria-disabled]="disabled"
    (click)="toggleDropdown()"
  >
  <span
    class="dropdown-display-text"
    [class.placeholder]="!selectedDisplayLabel"
  >
    {{ selectedDisplayLabel || 'Select option...' }}
  </span>

    <span class="dropdown-toggle">
    {{ isOpen ? '▲' : '▼' }}
  </span>
  </div>

  <!-- =========================================
       DROPDOWN PANEL
       ========================================= -->
  <div
    class="dropdown-options-box"
    *ngIf="isOpen"
    (click)="$event.stopPropagation()"
  >

    <!-- =========================================
         OPTIONS
         ========================================= -->
    <div class="dropdown-items-container">

      <!-- ALL OPTION -->
      <div
        *ngIf="showAllOption"
        class="checkbox-option all-option"
        [class.option]="value === null"
        (click)="selectAll()"
      >
        <span class="option-text">
          {{ allLabel }}
        </span>
      </div>


      <!-- NORMAL OPTIONS -->
      <div
        *ngFor="let item of data"
        class="checkbox-option"
        [class.option]="isSelected(item)"
        (click)="selectItem(item)"
      >
        <span class="option-text">
          {{ getItemLabel(item) }}
        </span>
      </div>


      <!-- NO RESULTS -->
      <div
        *ngIf="data.length === 0 && !showAllOption"
        class="no-results"
      >
        No items found
      </div>

    </div>

  </div>


  <!-- =========================================
       VALIDATION ERROR
       ========================================= -->
  <div
    *ngIf="isInvalid"
    class="dropdown-error-msg"
  >
    {{ errorMessage }}
  </div>

</div>
