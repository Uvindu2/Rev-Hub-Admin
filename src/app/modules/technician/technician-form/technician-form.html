<div class="modal-container">
  <div class="modal-header">
    <h2>Create New Technician</h2>
    <button class="close-btn" (click)="onCancel()">&times;</button>
  </div>

  <form [formGroup]="technicianForm" (ngSubmit)="onSubmit()">
    <div class="modal-body">

      <div class="form-group">
        <label>Technician Name <span class="required">*</span></label>
        <input type="text" formControlName="technicianName" placeholder="e.g. Brake Fluid">
        <div *ngIf="isInvalid('technicianName')" class="error-msg">Technician name is required.</div>
      </div>

      <div class="form-group">
        <label>Technician Contact <span class="required">*</span></label>
        <input type="text" formControlName="technicianContact" placeholder="077 000 0000">
        <div *ngIf="isInvalid('technicianContact')" class="error-msg">Technician contact is required.</div>
      </div>

      <div class="form-group">
        <label>Specialty <span class="required">*</span></label>
        <input type="text" formControlName="specialty" placeholder="">
      </div>
    </div>

    <div class="modal-footer">
      <button type="submit" class="btn-submit">SUBMIT</button>
      <button type="button" class="btn-cancel" (click)="onCancel()">CANCEL</button>
    </div>
  </form>
</div>
