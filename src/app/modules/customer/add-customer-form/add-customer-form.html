<div class="modal-overlay">
  <div class="modal-card">

    <div class="modal-header">
      <h3>Add Customer</h3>
      <button class="close-header-btn" type="button" (click)="closePopup()">
        &times;
      </button>
    </div>

    <!-- Main Reactive Form Wrapper -->
    <form [formGroup]="customerAddForm" (ngSubmit)="saveCustomer()">

      <div class="modal-body">

        <!-- Contact Number Search -->
        <div class="form-group">
          <label>Search Contact Number</label>
          <div class="form-row">
            <input class="form-control"
                   type="tel"
                   [value]="searchContactNumber"
                   (input)="onSearchInput($event)"
                   placeholder="Enter contact number">

            <button type="button"
                    class="btn-primary"
                    (click)="searchCustomer()">
              Search
            </button>
          </div>
        </div>

        <!-- Customer Name -->
        <div class="form-group">
          <label>Customer Name <span class="required">*</span></label>
          <input class="form-control"
                 type="text"
                 formControlName="customerName"
                 placeholder="Jack Smith">
          <div *ngIf="isInvalid('customerName')" class="error-msg">Customer Name is required.</div>
        </div>

        <!-- Contact + Email -->
        <div class="form-row">
          <div class="form-group">
            <label>Contact Number <span class="required">*</span></label>
            <input class="form-control"
                   type="tel"
                   formControlName="contactNumber"
                   placeholder="0412 345 678">
            <div *ngIf="isInvalid('contactNumber')" class="error-msg">Contact Number is required.</div>
          </div>

          <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input class="form-control"
                   type="email"
                   formControlName="email"
                   placeholder="jack.smith@example.com.au">
            <div *ngIf="isInvalid('email')" class="error-msg">
              <span *ngIf="customerAddForm.get('email')?.errors?.['required']">Email is required.</span>
              <span *ngIf="customerAddForm.get('email')?.errors?.['email']">Please enter a valid email.</span>
            </div>
          </div>
        </div>

        <!-- Address -->
        <div class="form-group">
          <textarea class="form-control"
                    formControlName="customerAddress"
                    placeholder="123 George Street, Sydney NSW 2000"></textarea>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
        <button class="btn-primary" type="submit">Save</button>
      </div>

    </form>

  </div>
</div>
