<div class="modal-container">
  <div class="modal-header">
    <h2>CUSTOMER</h2>
    <button class="close-btn" (click)="onCancel()">&times;</button>
  </div>


  <form [formGroup]="customerForm">
    <div class="modal-body">

      <div class="form-group">
        <label>Customer Name <span class="required">*</span></label>
        <input type="text" formControlName="customerName" placeholder="e.g. Brake Fluid">
        <div *ngIf="isInvalid('customerName')" class="error-msg">Customer Name is required.</div>
      </div>

      <div class="form-group">
        <label>Contact Number <span class="required">*</span></label>
        <input type="text" formControlName="contactNumber" placeholder="012 456 7891">
        <div *ngIf="isInvalid('contactNumber')" class="error-msg">Contact Number is required.</div>
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="text" formControlName="email" placeholder="0.00">
        <div *ngIf="isInvalid('email')" class="error-msg">Email is required.</div>
      </div>

      <div class="form-group">
        <label>Address <span class="required">*</span></label>
        <input type="text" formControlName="customerAddress" placeholder="0.00">
        <div *ngIf="isInvalid('customerAddress')" class="error-msg">Address is required.</div>
      </div>

    </div>

    <div class="modal-footer">
      <button type="submit" class="btn-submit"  (click)="onSubmit()" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting" class="icon">+</span>
        <span *ngIf="isSubmitting" class="buttonSpinner"></span>

        {{ isSubmitting ? 'SUBMITTING...' : 'SUBMIT' }}
      </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">CANCEL</button>
    </div>
  </form>
</div>
