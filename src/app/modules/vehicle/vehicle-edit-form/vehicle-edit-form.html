<div class="modal-overlay">
  <div class="modal-card enhanced-wide-modal">
    <div class="modal-header">
      <h3>Edit Vehicle Profile</h3>
      <button class="close-header-btn" (click)="closeForm()">&times;</button>
    </div>

    <form [formGroup]="vehicleForm">
      <div class="modal-body">

        <!-- Standard Inputs -->
        <div class="form-row">
          <div class="form-group">
            <label>Registration Number</label>
            <input type="text" formControlName="vehicleRegNo" class="form-control">
          </div>
          <div class="form-group">
            <label>Make</label>
            <input type="text" formControlName="vehicleMake" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Year</label>
            <input type="text" formControlName="vehicleYear" class="form-control">
          </div>
          <div class="form-group">
            <label>Model</label>
            <input type="text" formControlName="vehicleModel" class="form-control">
          </div>
        </div>

        <!-- Customer Section -->
        <div class="customers-management-section">
          <div class="section-control-header">
            <h4>Assigned Customer</h4>
            <button type="button" class="btn-add-item" (click)="showCustomerPopup = true" *ngIf="!currentCustomer">
              <span>➕</span> Add Customer
            </button>
          </div>

          <table class="modal-embedded-table">
            <thead>
            <tr>
              <th>Customer Name</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngIf="currentCustomer">
              <td>{{ currentCustomer.customerName }}</td>
              <td>{{ currentCustomer.email }}</td>
              <td class="text-center">
                <button type="button" class="btn-inline-delete" (click)="removeCustomer()">🗑️</button>
              </td>
            </tr>
            <tr *ngIf="!currentCustomer">
              <td colspan="3" class="table-empty-state">No customer assigned.</td>
            </tr>
            </tbody>
          </table>

          <!-- Validation Message -->
          <div *ngIf="isInvalid('customerId')" class="error-msg" style="color: red; margin-top: 10px;">
            * A customer must be assigned to this vehicle to save.
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="submit" class="btn-submit"  (click)="submitForm()" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting" class="icon">+</span>
          <span *ngIf="isSubmitting" class="buttonSpinner"></span>

          {{ isSubmitting ? 'SUBMITTING...' : 'SUBMIT' }}
        </button>
        <button type="button" class="btn-secondary" (click)="closeForm()">CANCEL</button>
      </div>
    </form>
  </div>
</div>

<app-add-customer-form *ngIf="showCustomerPopup" (close)="showCustomerPopup = false" (customerSaved)="onCustomerSaved($event)">
</app-add-customer-form>
