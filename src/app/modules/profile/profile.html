<div class="page-header"></div>

<div class="loader" *ngIf="isLoading">
  <div class="loader-spinner"></div>
  <span>Loading profile...</span>
</div>

<section class="card-container profile-container" *ngIf="!isLoading">
  <header class="modal-header">
    <h2>MY PROFILE</h2>
  </header>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <div class="modal-body profile-grid">
      <div class="form-group">
        <label for="profile-username">Username</label>
        <input id="profile-username" type="text" formControlName="username">
      </div>

      <div class="form-group">
        <label for="profile-full-name">Full Name <span class="required">*</span></label>
        <input id="profile-full-name" type="text" formControlName="fullName" placeholder="Full name">
        <div class="error-msg" *ngIf="profileForm.get('fullName')?.invalid && profileForm.get('fullName')?.touched">
          Full name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="profile-speciality">Speciality</label>
        <input id="profile-speciality" type="text" formControlName="speciality" placeholder="Speciality">
      </div>

      <div class="form-group">
        <label for="profile-role">User Role</label>
        <input id="profile-role" type="text" formControlName="role" readonly aria-readonly="true">
      </div>
    </div>

    <footer class="modal-footer profile-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">CANCEL</button>
      <button type="submit" class="btn-submit" [disabled]="isSubmitting || !profileForm.valid">
        {{ isSubmitting ? 'UPDATING...' : 'UPDATE PROFILE' }}
      </button>
    </footer>
  </form>
</section>
