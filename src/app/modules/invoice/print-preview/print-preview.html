<div class="page-header">
  <div class="card-container print-preview-page-container">

    <div class="custom-preview-header">
      <div class="header-title-group">
        <h2>📑 {{ pdfName }}</h2>
      </div>
    </div>

    <div class="custom-preview-body">
      <iframe [src]="pdfUrl" title="PDF Print Preview"></iframe>
    </div>

    <div class="custom-preview-footer">
      <button type="button" class="btn-cancel-custom" (click)="onClose()">BACK</button>
      <button type="button" class="btn-print-custom" (click)="printPdf()">🖨️ PRINT</button>
    </div>

  </div>
</div>
