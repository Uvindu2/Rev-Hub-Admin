<div class="modal-overlay">
  <div class="revhub-builder-card print-preview-card">
    <div class="form-title-bar">
      <h2>INVOICE PRINT PREVIEW</h2>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <div class="preview-body-container" style="margin-top: 15px; height: 60vh; background: #222; border-radius: 4px; overflow: hidden;">
      <iframe [src]="pdfUrl" width="100%" height="100%" style="border: none;"></iframe>
    </div>

    <div class="form-actions" style="margin-top: 15px; display: flex; justify-content: flex-end;">
      <button type="button" class="btn-cancel" (click)="onClose()">Close Preview</button>
    </div>
  </div>
</div>
