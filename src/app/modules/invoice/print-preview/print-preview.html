<div class="print-preview-backdrop">
  <div class="custom-preview-card">

    <!-- Header -->
    <div class="custom-preview-header">
      <div class="header-title-group">
        <h2>📑 Invoice Print Preview</h2>
        <span class="sub-title">Generated from System Backend</span>
      </div>
      <button type="button" class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <!-- Body with PDF Iframe -->
    <div class="custom-preview-body">
      <iframe #pdfIframe [src]="pdfUrl" title="Invoice PDF Preview"></iframe>
    </div>

    <!-- Footer Actions -->
    <div class="custom-preview-footer">
      <button type="button" class="btn-cancel-custom" (click)="onClose()">Close</button>
      <button type="button" class="btn-print-custom" (click)="printPdf()">
        🖨️ Print PDF
      </button>
    </div>

  </div>
</div>
