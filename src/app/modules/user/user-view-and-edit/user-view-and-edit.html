<div class="modal-container">
  <div class="modal-header">
    <h2>CREATE NEW USER</h2>
    <button class="close-btn" (click)="onCancel()">&times;</button> <!-- Fixed typo from onCancel if needed, or keep your handler -->
  </div>

  <form [formGroup]="userForm">
    <div class="modal-body">

      <div class="form-group">
        <label>Username</label>
        <input type="text" readonly formControlName="username" placeholder="e.g. johndoe">
        <div *ngIf="isInvalid('username')" class="error-msg">Username is required.</div>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName" placeholder="e.g. John Doe">
        <div *ngIf="isInvalid('fullName')" class="error-msg">Name is required.</div>
      </div>

      <div class="form-group">
        <label>Speciality</label>
        <input type="text" formControlName="speciality" placeholder="e.g. Customer Relationship">
      </div>

      <!-- Multi-select element mapped to roleIds array -->
      <app-multi-select-dropdown
        label="User Role:"
        [formControl]="userRoleSelectedControl"
        [b]="rolesList"
        bindLabel="roleName"
        bindValue="roleId"
        errorMessage="Please select at least one user role.">
      </app-multi-select-dropdown>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="active"> Active Account
        </label>
      </div>

    </div>

    <div class="modal-footer">
      <button type="submit" class="btn-submit" (click)="onSubmit()" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting" class="icon">+</span>
        <span *ngIf="isSubmitting" class="buttonSpinner"></span>

        {{ isSubmitting ? 'SUBMITTING...' : 'SUBMIT' }}
      </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">CANCEL</button>
    </div>
  </form>
</div>
