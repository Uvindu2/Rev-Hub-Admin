<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="logo-container">
      <img src="assets/images/revHub.jpeg" alt="RevHub Logo">
    </div>
    <ul>
      <li routerLink="/dashboard/overview" routerLinkActive="active">
        <fa-icon [icon]="faDashboard"></fa-icon>
        Dashboard
      </li>
      <li routerLink="/dashboard/job-cards" routerLinkActive="active">
        <fa-icon [icon]="faXRay"></fa-icon>
        Job Cards
      </li>
      <li routerLink="/dashboard/invoices" routerLinkActive="active">
        <fa-icon [icon]="faFileLines"></fa-icon>
        Invoices
      </li>
      <li routerLink="/dashboard/customers" routerLinkActive="active">
        <fa-icon [icon]="faUsers"></fa-icon>
        Customers
      </li>
      <li routerLink="/dashboard/technicians" routerLinkActive="active">
        <fa-icon [icon]="faWrench"></fa-icon>
        Technicians
      </li>
      <li routerLink="/dashboard/vehicles" routerLinkActive="active">
        <fa-icon [icon]="faCar"></fa-icon>
        Vehicles
      </li>
      <li routerLink="/dashboard/items" routerLinkActive="active">
        <fa-icon [icon]="faBox"></fa-icon>
        Items
      </li>
      <li routerLink="/dashboard/labor-activities" routerLinkActive="active">
        <fa-icon [icon]="faClipboardList"></fa-icon>
        Labor Activities
      </li>
      <li>
        <fa-icon [icon]="faReports"></fa-icon>
        Reports
      </li>
      <li routerLink="/dashboard/users" routerLinkActive="active">
        <fa-icon [icon]="faUsers"></fa-icon>
        Users
      </li>
    </ul>
    <div class="navigation-container">
      <img src="assets/images/cara1.jpg" alt="carImage">
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="menu-icon" (click)="toggleSidebar()">
        <fa-icon [icon]="faBars"></fa-icon>
      </div>
      <h1 style="margin: 0;">{{ pageTitle }}</h1>
      <div class="right">
        <span>📅 20 May 2024</span>
        <span>🔔 3</span>
        <div class="user-profile" (click)="toggleDropdown()">
          <div class="user-avatar">
            <fa-icon [icon]="faUser"></fa-icon>
          </div>
          <span class="username">Admin</span>
          <fa-icon [icon]="faChevronDown"></fa-icon>

          <div class="dropdown-menu" *ngIf="isDropdownOpen">
            <ul>
              <li>Profile</li>
              <li>Settings</li>
              <li (click)="logout()">Logout</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <router-outlet></router-outlet>
  </div>
</div>
