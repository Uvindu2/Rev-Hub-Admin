<div class="modal-container">
  <button class="close-btn" (click)="onCancel()">&times;</button>
  <div class="modal-header">
    <h2>CREATE NEW LABOR ACTIVITY</h2>
  </div>

  <form [formGroup]="laborActivityForm">
    <div class="modal-body">

      <div class="form-group">
        <label>Labor Activity Name <span class="required">*</span></label>
        <input type="text" formControlName="laborActivityName" placeholder="e.g. Break Pad Replacement">
        <div *ngIf="isInvalid('laborActivityName')" class="error-msg">Name is required.</div>
      </div>

      <div class="form-group">
        <label>Status <span class="required">*</span></label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" formControlName="active" [value]="true">
            <span>Active</span>
          </label>
          <label class="radio-option">
            <input type="radio" formControlName="active" [value]="false">
            <span>Inactive</span>
          </label>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button type="submit" class="btn-submit" (click)="onSubmit()" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting" class="icon">+</span>
        <span *ngIf="isSubmitting" class="buttonSpinner"></span>

        {{ isSubmitting ? 'SUBMITTING...' : 'SUBMIT' }}
      </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">
        CANCEL
      </button>
    </div>
  </form>
</div>
