<div class="page-header">
  <div class="card-container labor-form-container">
    <div class="filter-card-header labor-form-header">
      <div class="filter-title-wrapper">
        <span class="filter-title-icon">🔧</span>
        <h3>{{ isEditMode ? 'EDIT LABOR ACTIVITY' : 'VIEW LABOR ACTIVITY' }}</h3>
      </div>
    </div>

    <form [formGroup]="laborActivityForm" (ngSubmit)="onSubmit()">

      <div class="labor-form-grid">

        <div class="filter-group">
          <label>
            Labor Activity Name <span class="required">*</span>
          </label>

          <input
            type="text"
            formControlName="laborActivityName"
            placeholder="e.g. Brake Pad Replacement">

          <div
            *ngIf="isInvalid('laborActivityName')"
            class="error-msg">
            Name is required.
          </div>
        </div>

        <div class="filter-group">
          <label>
            Status <span class="required">*</span>
          </label>

          <div class="radio-group">

            <label class="labor-radio-option">
              <input
                type="radio"
                formControlName="active"
                [value]="true">
              <span>Active</span>
            </label>

            <label class="radio-option">
              <input
                type="radio"
                formControlName="active"
                [value]="false">
              <span>Inactive</span>
            </label>

          </div>
        </div>

      </div>

      <div class="labor-form-footer">

        <button
          type="button"
          class="btn-filter-reset"
          (click)="onCancel()">
          ← BACK
        </button>

        <button
          *ngIf="isEditMode"
          type="submit"
          class="btn-add"
          [disabled]="isSubmitting">

          <span
            *ngIf="isSubmitting"
            class="buttonSpinner">
          </span>

          <span
            *ngIf="!isSubmitting"
            class="icon-plus">
            ✓
          </span>

          {{ isSubmitting ? 'SUBMITTING...' : 'UPDATE' }}

        </button>

      </div>

    </form>

  </div>
</div>
