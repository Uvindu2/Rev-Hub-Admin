<div class="page-header">
  <div class="card-container labor-form-container">

    <div class="filter-card-header labor-form-header">
      <div class="filter-title-wrapper">
        <span class="filter-title-icon">🔧</span>
        <h3>CREATE NEW LABOR ACTIVITY</h3>
      </div>
    </div>

    <form
      [formGroup]="laborActivityForm"
      (ngSubmit)="onSubmit()">

      <div class="labor-form-grid">

        <div class="filter-group">
          <label>
            Labor Activity Name
            <span class="required">*</span>
          </label>

          <input
            type="text"
            formControlName="laborActivityName"
            placeholder="e.g. Brake Pad Replacement">

          <div
            *ngIf="isInvalid('laborActivityName')"
            class="error-msg">
            Name is required.
          </div>
        </div>

        <div class="filter-group">
          <label>
            Status
            <span class="required">*</span>
          </label>

          <div class="radio-group">

            <label class="radio-option">
              <input
                type="radio"
                formControlName="active"
                [value]="true">
              <span>Active</span>
            </label>

            <label class="radio-option">
              <input
                type="radio"
                formControlName="active"
                [value]="false">
              <span>Inactive</span>
            </label>

          </div>
        </div>

      </div>

      <div class="labor-form-footer">

<!--        <button-->
<!--          type="button"-->
<!--          class="btn-filter-reset"-->
<!--          (click)="onBack()">-->
<!--          ← BACK-->
<!--        </button>-->

                <button
                  type="button"
                  class="btn-filter-reset"
                  (click)="onBack()">
                  BACK
                </button>

        <button
          type="submit"
          class="btn-add"
          [disabled]="isSubmitting">

          <span
            *ngIf="isSubmitting"
            class="buttonSpinner">
          </span>

          {{ isSubmitting ? 'SUBMITTING...' : 'SUBMIT' }}

        </button>

      </div>

    </form>

  </div>
</div>
