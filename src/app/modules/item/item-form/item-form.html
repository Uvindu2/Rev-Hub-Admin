<div class="page-header">
  <div class="card-container item-form-container">

    <div class="filter-card-header item-form-header">
      <div class="filter-title-wrapper">
        <span class="filter-title-icon">📦</span>
        <h3>CREATE NEW ITEM</h3>
      </div>

<!--      <button-->
<!--        type="button"-->
<!--        class="btn-filter-reset"-->
<!--        (click)="onBack()">-->
<!--        BACK-->
<!--      </button>-->
    </div>

    <form
      [formGroup]="itemForm"
      (ngSubmit)="onSubmit()">

      <div class="item-form-grid">

        <div class="filter-group">
          <label>
            Item Name
            <span class="required">*</span>
          </label>

          <input
            type="text"
            formControlName="itemName"
            placeholder="e.g. Brake Fluid">

          <div
            *ngIf="isInvalid('itemName')"
            class="error-msg">
            Item name is required.
          </div>
        </div>

        <div class="filter-group">
          <label>
            Supplier Price
            <span class="required">*</span>
          </label>

          <input
            type="text"
            formControlName="supplierPrice"
            placeholder="0.00">

          <div
            *ngIf="isInvalid('supplierPrice')"
            class="error-msg">
            Supplier price is required.
          </div>
        </div>

        <div class="filter-group">
          <label>
            Selling Price
            <span class="required">*</span>
          </label>

          <input
            type="text"
            formControlName="sellingPrice"
            placeholder="0.00">

          <div
            *ngIf="isInvalid('sellingPrice')"
            class="error-msg">
            Selling price is required.
          </div>
        </div>

        <div class="filter-group">
          <label>
            Unit of Measure
            <span class="required">*</span>
          </label>

          <select formControlName="measuringUnitType">
            <option value="" disabled>
              Select unit...
            </option>

            <option
              *ngFor="let type of unitTypesList"
              [value]="type">
              {{ unitDisplayMap[type] }}
            </option>
          </select>

          <div
            *ngIf="isInvalid('measuringUnitType')"
            class="error-msg">
            Please select a unit type.
          </div>
        </div>

        <div class="item-form-full">
          <app-multi-select-search-dropdown
            label="Select Labor Activity:"
            [formControl]="repairLaborActivitiesSelectedControl"
            [data]="laborActivityNameProjection"
            bindLabel="activityName"
            bindValue="laborActivityId"
            errorMessage="Please select at least one labor activity.">
          </app-multi-select-search-dropdown>
        </div>

      </div>

      <div class="item-form-footer">

        <button
          type="button"
          class="btn-filter-reset"
          (click)="onBack()">
          BACK
        </button>

        <button
          type="submit"
          class="btn-add"
          [disabled]="isSubmitting">

          <span
            *ngIf="isSubmitting"
            class="buttonSpinner">
          </span>

          {{ isSubmitting ? 'SUBMITTING...' : 'SUBMIT' }}

        </button>

      </div>

    </form>

  </div>
</div>
